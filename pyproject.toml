[project]
name = "mailroom"
version = "0.1.0"
description = "Mail-intake: läser inkorgen via Microsoft Graph, klassificerar per projekt med LLM, flaggar viktiga punkter."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "msal>=1.31",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "apscheduler>=3.10",
    "anthropic>=0.40",
    "pypdf>=5.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mailroom = ["static/*.html"]